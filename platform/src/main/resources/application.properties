# ============================================================================
# CONFIGURATION POSTGRESQL - PLATEFORME MICRO-LEARNING
# ============================================================================

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/microlearning_db?stringtype=unspecified
spring.datasource.username=microlearning_user
spring.datasource.password=microlearning_pass_2026
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8080

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.ma.ensa.microlearning=DEBUG

# Application Info
spring.application.name=microlearning-platform

# Ollama API Configuration
ollama.api.url=${OLLAMA_API_URL:http://localhost:11434/api/generate}
ollama.model=${OLLAMA_MODEL:llama3.2:1b}